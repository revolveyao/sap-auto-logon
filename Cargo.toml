[package]
name = "sap-auto-logon"
version = "0.2.8"
edition = "2021"
description = "SAP Auto Logon"
license = "MIT"
build = "build.rs"

[dependencies]
# 唯一框架依赖。gpui-pre + gpui-base + gpui-component + gpui-kit-assets 由它引入，
# 不要再单独声明 `gpui` / `gpui-component`：那会编出两套 GPUI，Entity 传不过去。
gpui-kit = "0.9.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
anyhow = "1"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
roxmltree = "0.20"
# 应用文案走 rust-i18n；gpui-kit 的组件文案也由它接管（逐键深合并）。
rust-i18n = "4.2"
# 检查 GitHub Release 与下载安装包：同步 HTTP，跑在后台线程里。
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
# 托盘图标与 exe 图标同源，运行时把 PNG 解成 RGBA 交给 tray-icon。
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = "0.19"
winreg = "0.56"
windows-registry = "0.5"
# 凭据管理器（CredWriteW / CredReadW / CredDeleteW）与单实例互斥体。
# `Win32_Security_Credentials` 是 Cred* 的归属模块；缺它那两个函数不会出现在
# 绑定里，报错是「找不到名字」，看不出与 feature 有关。
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_ToolHelp",
    # GetFileVersionInfo*：读 SAP GUI 版本，决定默认是否开 UUID 模式。
    "Win32_Storage_FileSystem",
    # DwmGetWindowAttribute：读回窗口实际用的背景材质，确认 Mica 真的设上了。
    "Win32_Graphics_Dwm",
    # CreateBitmap / DeleteObject：给 SAP 会话窗口画任务栏图标。
    "Win32_Graphics_Gdi",
    # GetDpiForWindow：按窗口缩放比生成精确像素尺寸的任务栏图标。
    "Win32_UI_HiDpi",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[profile.dev]
debug = 1
incremental = true

[profile.dev.package."*"]
debug = false
